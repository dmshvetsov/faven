---
name: anchor
id: anchor
runbooks:
  - name: deployment
    description: Deploy programs
    location: runbooks/deployment
  - name: markets
    description: Create the local Options Markets after deploying the program
    location: runbooks/markets
environments:
  localnet:
      network_id: localnet
      rpc_api_url: http://127.0.0.1:8899
  devnet:
      network_id: devnet
      rpc_api_url: https://api.devnet.solana.com
      payer_keypair_json: ~/.config/solana/faven-dev.json
      authority_keypair_json: ~/.config/solana/faven-dev.json
