[package]
name = "options"
version = "0.1.0"
description = "Options program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "options"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
pyth-solana-receiver-sdk = "2.0.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-sdk = "3"
solana-program-pack = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
